ktor {
  deployment {
    port = 8080
  }
  application {
    modules = [ com.example.app.ApplicationKt.module ]
  }
}

db {
  jdbcUrl = "jdbc:postgresql://localhost:5433/app_db"
  username = "app_user"
  password = "app_password"
  driver = "org.postgresql.Driver"
  maximumPoolSize = 10
}

jwt {
  secret = "change-me-super-secret-key"
  issuer = "collabme-backend"
  audience = "collabme-clients"
  realm = "CollabMe API"
  accessTokenTtlSeconds = 3600
}

